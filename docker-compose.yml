services:
  db:
    image: mysql:8
    container_name: rejeki-db
    restart: unless-stopped
    environment:
      # Nilai diambil dari file .env di folder root (lihat .env.example)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di file .env}
      MYSQL_DATABASE: rejeki
      MYSQL_USER: ${MYSQL_USER:-rejeki_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?isi MYSQL_PASSWORD di file .env}
    ports:
      # Hanya bisa diakses dari komputer/server ini, tidak terbuka ke jaringan publik
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  dbdata:
